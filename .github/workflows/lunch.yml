name: Uppdatera lunch

on:
  schedule:
    # OBS: GitHub-cron KÖAR vid dessa tider men startar ofta 60–150 min senare.
    # Därför tätt+tidigt: körningarna landar utspritt över morgonen och fångar
    # veckobytet (bara måndag är känsligt – tis–fre ligger hela veckan redan i filen).
    - cron: '0,30 4-7 * * 1-5'  # köas var 30:e min 06:00–09:30 sv → körs ~07:00–11:30 sv
    - cron: '0 9 * * 1-5'       # köas 11:00 sv → backstop tidig eftermiddag
    - cron: '0 11,13,15 * * 1'  # köas 13/15/17 sv MÅNDAG → fångar sent publicerad ny-veckas-meny
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lunch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Hämta veckomatsedel
        run: node scripts/lunch-scrape.mjs
      - name: Committa om datan ändrats
        run: |
          if [[ -n "$(git status --porcelain data/lunch.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/lunch.json
            git commit -m "Uppdatera lunch ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break || { echo "Push-krock, försök $i…"; sleep $((RANDOM % 5 + 2)); }
            done
          else
            echo "Ingen ändring i lunchen."
          fi
